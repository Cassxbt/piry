name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts-and-workflow:
    name: Contracts, CRE workflow, keeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Kuru preflight checker
        run: python3 -m unittest discover -s tests -v
      - name: Solidity
        run: forge test
      - name: Workflow typecheck
        run: npm run check:workflow
      - name: Workflow tests (Node + Bun, incl. keeper)
        run: npm run test:workflow

  plugin:
    name: MetaMask Agent Wallet plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: plugins/metamask-piry
      - run: npm run typecheck
        working-directory: plugins/metamask-piry
      - run: npm test
        working-directory: plugins/metamask-piry

  app:
    name: Judge app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npx vitest run
        working-directory: app
      - run: npm run build
        working-directory: app
